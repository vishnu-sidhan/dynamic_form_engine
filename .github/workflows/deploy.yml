name: Build & Deploy (Web to gh-pages & Android APK)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "deployment"
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Web & Commit to gh-pages branch
  # -------------------------------------------------------------
  build-and-deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies (Root Package)
        run: flutter pub get

      - name: Install dependencies (Example App)
        working-directory: example
        run: flutter pub get

      - name: Build Flutter Web
        working-directory: example
        run: |
          flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./example/build/web
          publish_branch: gh-pages
          force_orphan: true

  # -------------------------------------------------------------
  # Job 2: Build Android Release APK & Upload Artifact
  # -------------------------------------------------------------
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies (Root Package)
        run: flutter pub get

      - name: Install dependencies (Example App)
        working-directory: example
        run: flutter pub get

      - name: Build Android APK
        working-directory: example
        run: flutter build apk --release

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: example/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Publish to GitHub Releases (On Version Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: example/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
